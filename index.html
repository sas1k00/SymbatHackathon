<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Founder Cup Anywhere</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tournament desk. A sticky scoreboard header, one centred column, cups drawn as perforated entry tickets. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#0E1A33; --muted:#566178; --line:#D8DEEA;
  --primary:#1B4DDB; --primary-ink:#FFFFFF; --gold:#B87A00; --gold-soft:#FFF1CC; --gold-ink:#3D2A00;
  --good:#18794E; --good-soft:#DDF3E8; --warn:#B4400A; --warn-soft:#FDE7DA; --chip:#E6EBF6;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1120; --surface:#121B31; --ink:#EAF0FF; --muted:#9DAAC6; --line:#27334F;
  --primary:#7C9DFF; --primary-ink:#0A1120; --gold:#F2B92E; --gold-soft:#3A2E0B; --gold-ink:#FFE6A3;
  --good:#4CC38A; --good-soft:#12301F; --warn:#FF9A62; --warn-soft:#3A1D0E; --chip:#1B2744; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#121B31; --ink:#EAF0FF; --muted:#9DAAC6; --line:#27334F;
  --primary:#7C9DFF; --primary-ink:#0A1120; --gold:#F2B92E; --gold-soft:#3A2E0B; --gold-ink:#FFE6A3;
  --good:#4CC38A; --good-soft:#12301F; --warn:#FF9A62; --warn-soft:#3A1D0E; --chip:#1B2744; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:clamp(1.6rem,4.6vw,2.7rem);letter-spacing:-.01em}
h2{font-size:clamp(1.1rem,2.6vw,1.45rem)}
h3{font-size:1rem;font-weight:500}
p{margin:0}
a{color:var(--primary)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--gold);position:relative}
.brand i::after{content:"";position:absolute;inset:5px 6px 8px;border-radius:0 0 6px 6px;background:var(--surface)}
.nav{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1}
.nav button{background:none;border:0;font:inherit;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:500}
.nav button[aria-current="page"]{color:var(--ink);background:var(--chip)}
.nav button:hover{color:var(--ink)}
@media (max-width:640px){.nav{order:3;flex-basis:100%}.brand{flex:1}}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;font:inherit;font-size:.8rem;font-weight:600;padding:5px 9px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ribbon{background:var(--gold-soft);color:var(--gold-ink);font-size:.8125rem;border-bottom:1px solid var(--line)}
.ribbon .wrap{padding-block:6px}

/* buttons */
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
:root[data-theme="dark"] .btn.gold{color:#201500}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.gold{color:#201500}}
.btn.sm{padding:6px 12px;font-size:.875rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* sections */
main{padding-block:24px 56px;display:flex;flex-direction:column;gap:32px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.two{display:grid;gap:20px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plain{display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.open{background:var(--good-soft);color:var(--good)}
.tag.done{background:var(--gold-soft);color:var(--gold-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.lvl-gold{background:var(--gold-soft);color:var(--gold-ink)}
.lvl-silver{background:var(--chip);color:var(--ink)}
.lvl-bronze{background:var(--warn-soft);color:var(--warn)}

/* hero */
.hero{display:grid;gap:24px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center;padding-block:8px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero p.lead{font-size:1.0625rem;color:var(--muted);max-width:56ch}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}

/* ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1fr) auto;min-width:0;text-align:left;color:inherit;font:inherit;padding:0;width:100%}
button.ticket{cursor:pointer}
button.ticket:hover{border-color:var(--primary)}
.ticket .main{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ticket .stub{border-left:2px dashed var(--line);padding:14px 14px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-width:104px}
.ticket .stub b{font-family:var(--mono);font-size:1.05rem;letter-spacing:.08em}
.ticket .stub span{font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ticket h3{overflow-wrap:anywhere}
.bigcode{font-family:var(--mono);font-weight:700;font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:.14em;background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:10px;display:inline-block}

/* path */
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.path{grid-template-columns:repeat(2,minmax(0,1fr))}}
.path div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;position:relative}
.path div b{font-family:var(--display);font-size:.875rem}
.path div em{font-style:normal;font-family:var(--mono);font-size:.75rem;color:var(--gold)}
.path div:last-child{border-color:var(--gold)}

/* tour */
.tour{background:var(--surface);border:1px solid var(--primary);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.steps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.steps button{font:inherit;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.steps button:hover{border-color:var(--primary)}
.steps .n{font-family:var(--mono);font-weight:700;width:24px;height:24px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none;font-size:.8rem}
.steps .ok .n{background:var(--good);color:#fff}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{font-family:var(--display);font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:.8125rem;color:var(--muted)}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:.875rem}
.field small{color:var(--muted);font-size:.8125rem}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
input[type=range]{width:100%;accent-color:var(--primary)}

/* pre-check */
.meter{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:999px}
.meter.gold i{background:var(--gold)}
.meter.good i{background:var(--good)}
.score{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums}
ul.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.875rem}
ul.chk li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:start}
ul.chk .y{color:var(--good);font-weight:700}
ul.chk .n{color:var(--muted)}
ul.chk small{color:var(--muted);display:block}

/* tabs, tables */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.win td{background:var(--gold-soft);color:var(--gold-ink)}
.vote{display:flex;align-items:center;gap:8px;justify-content:space-between}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
dl{margin:0;display:grid;gap:12px}
dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
dd{margin:2px 0 0;overflow-wrap:anywhere}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:var(--gold-soft);color:var(--gold-ink);border-radius:0 10px 10px 0;font-size:.875rem}
.okmsg{border-left:3px solid var(--good);padding:10px 12px;background:var(--good-soft);color:var(--ink);border-radius:0 10px 10px 0}
.copybox{font-family:var(--mono);font-size:.8125rem;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}

/* certificate */
.cert{background:var(--surface);border:2px solid var(--gold);border-radius:var(--r);padding:clamp(18px,5vw,40px);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;max-width:720px;margin:0 auto;width:100%}
.cert h1{font-size:clamp(1.3rem,4vw,2rem)}
.cert .id{font-family:var(--mono);font-size:.875rem;border:1px dashed var(--line);padding:6px 12px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:20;max-width:90vw}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.8125rem}
footer .wrap{padding-block:16px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
</style>

<header class="top"><div class="wrap">
  <button class="brand" data-go="home"><i></i>Founder Cup Anywhere</button>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="ru" id="lang-ru">RU</button><button data-lang="en" id="lang-en">EN</button>
  </div>
</div></header>
<div class="ribbon"><div class="wrap" id="ribbon"></div></div>
<main class="wrap" id="app"></main>
<footer><div class="wrap"><span id="foot"></span><button class="btn sm" data-act="reset" id="reset-btn"></button></div></footer>
<div class="toast" id="toast" hidden></div>

/* helpers */
function tr(ru,en){return S.lang==='en'?en:ru}
function L(v){return Array.isArray(v)?v[S.lang==='en'?1:0]:(v==null?'':v)}
function R(v){return Array.isArray(v)?v[0]:(v||'')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function E(v){return esc(L(v))}
function pl(n,one,few,many,en1,enN){if(S.lang==='en')return n===1?en1:enN;var a=Math.abs(n)%100,b=a%10;return (a>10&&a<20)?many:b===1?one:(b>=2&&b<=4)?few:many}
function PR(n){return pl(n,'проект','проекта','проектов','project','projects')}
function PP(n){return pl(n,'опубликованный проект','опубликованных проекта','опубликованных проектов','published project','published projects')}
function VT(n){return pl(n,'голос','голоса','голосов','vote','votes')}
function nf(n){return Number(n).toLocaleString(S.lang==='en'?'en-US':'ru-RU')}
function fd(d){return new Date(d+'T12:00:00').toLocaleDateString(S.lang==='en'?'en-GB':'ru-RU',{day:'numeric',month:'short'})}
function cup(code){return S.cups.filter(function(c){return c.code===code})[0]}
function proj(id){return S.projects.filter(function(p){return p.id===id})[0]}
function cupProjects(code,all){return S.projects.filter(function(p){return p.cup===code&&(all||p.status==='published')})}
function daysLeft(d){return Math.ceil((new Date(d+'T23:59:59').getTime()-NOW)/DAY)}
function cupStatus(c){if(c.winner)return 'done'; if(daysLeft(c.deadline)>=0)return 'open'; return 'final'}
function statusTag(c){var s=cupStatus(c);
  if(s==='done')return '<span class="tag done">'+tr('Победитель объявлен','Winner announced')+'</span>';
  if(s==='open')return '<span class="tag open">'+tr('Приём проектов','Open for projects')+'</span>';
  return '<span class="tag warn">'+tr('Ждёт решения жюри','Awaiting jury')+'</span>'}

function precheck(p){
  var t=R(p.title).trim(),pr=R(p.problem).trim(),au=R(p.audience).trim(),so=R(p.solution).trim(),ev=R(p.evidence).trim(),ln=(p.link||'').trim(),D=/\d/;
  var items=[
   [t.length>=3&&t.length<=40,5,tr('Название от 3 до 40 знаков','Title is 3–40 characters'),tr('Дайте проекту короткое название.','Give the project a short name.')],
   [pr.length>=60,15,tr('Проблема описана подробно','Problem is described in detail'),tr('Опишите в 1–2 предложениях, у кого проблема и когда она возникает.','In 1–2 sentences, say who has the problem and when it happens.')],
   [D.test(pr),10,tr('В проблеме есть число','Problem includes a number'),tr('Добавьте число: сколько людей с этим столкнулись?','Add a number: how many people face this?')],
   [au.length>=25,10,tr('Аудитория названа конкретно','Audience is specific'),tr('Напишите, кто именно: возраст, класс, город.','Say exactly who: age, grade, city.')],
   [D.test(au)||/класс|лет|grade|age|year/i.test(au),10,tr('Указан возраст или класс','Age or grade is given'),tr('Уточните возраст или класс вашей аудитории.','Specify the age or grade of your audience.')],
   [so.length>=60,15,tr('Решение объяснено','Solution is explained'),tr('Объясните по шагам, как это работает.','Explain step by step how it works.')],
   [ev.length>=30,15,tr('Есть доказательство работы','There is proof of work'),tr('Что вы уже сделали? Опрос, прототип, тест.','What have you done so far? A survey, a prototype, a test.')],
   [D.test(ev),10,tr('В доказательстве есть результат в цифрах','Proof includes a result in numbers'),tr('Добавьте результат: сколько человек опросили или попробовали?','Add a result: how many people did you survey or test with?')],
   [/^https?:\/\/\S+\.\S+/.test(ln),10,tr('Есть ссылка на прототип или видео','Link to a prototype or video'),tr('Добавьте ссылку на прототип, макет или видео.','Add a link to a prototype, mock-up or video.')]
  ];
  var score=0; items.forEach(function(i){if(i[0])score+=i[1]});
  return {score:score,items:items};
}
var GATE=50;
function level(sc){return sc>=80?['gold','Gold']:sc>=65?['silver','Silver']:sc>=GATE?['bronze','Bronze']:null}
function lvlTag(sc){var l=level(sc);return l?'<span class="tag lvl-'+l[0]+'">'+l[1]+' · '+sc+'</span>':'<span class="tag">'+tr('Черновик','Draft')+' · '+sc+'</span>'}
function juryAvg(p){return p.jury?Math.round((p.jury[0]+p.jury[1]+p.jury[2])/3*10):0}
function total(p){return Math.round(0.5*juryAvg(p)+0.3*precheck(p).score+0.2*Math.min(p.votes,100))}
function ranked(code){return cupProjects(code).slice().sort(function(a,b){return total(b)-total(a)||b.votes-a.votes})}
function place(p){var r=ranked(p.cup);for(var i=0;i<r.length;i++)if(r[i].id===p.id)return i+1;return 0}
function certId(p){return 'FCA-'+p.cup+'-'+p.id.toUpperCase()}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2200)}
function copy(text){var done=function(){toast(tr('Скопировано','Copied'))};
  try{navigator.clipboard.writeText(text).then(done,function(){toast(tr('Выделите текст и скопируйте вручную','Select the text and copy it manually'))})}
  catch(e){toast(tr('Выделите текст и скопируйте вручную','Select the text and copy it manually'))}}

     '<div class="scroll"><table><tbody><tr><td>'+tr('Предпроверка','Pre-check')+'</td><td class="r">'+r.score+'</td></tr><tr><td>'+tr('Жюри','Jury')+'</td><td class="r">'+(p.jury?juryAvg(p):'—')+'</td></tr><tr><td><b>'+tr('Итог','Total')+'</b></td><td class="r"><b>'+total(p)+'</b></td></tr></tbody></table></div></div>'+
     '<div class="plain"><h3>'+tr('Поделиться','Share')+'</h3><div class="copybox" id="sh-text">'+esc(share)+'</div><div class="row"><button class="btn sm" data-act="copy" data-src="sh-text">'+tr('Скопировать текст','Copy text')+'</button><button class="btn sm gold" data-go="cert-'+p.id+'">'+tr('Сертификат','Certificate')+'</button></div></div>'
     :'<div class="card" id="check-panel">'+checkPanel(p)+'</div><button class="btn primary" data-go="edit-'+p.id+'">'+tr('Продолжить и опубликовать','Continue and publish')+'</button>')+
   '</div></div>';
}

function vCert(id){
  var p=proj(id); if(!p||p.status!=='published') return vNotFound(); var c=cup(p.cup), win=c.winner===p.id, pl=place(p), fin=!win&&c.winner&&pl<=3;
  var kind=win?tr('Победитель кубка','Cup winner'):fin?tr('Финалист кубка','Cup finalist'):tr('Участник кубка','Cup participant');
  return '<section><p class="small"><button class="btn sm" data-go="project-'+p.id+'">← '+E(p.title)+'</button></p>'+
   '<div class="cert"><span class="eyebrow">Founder Cup Anywhere · '+tr('демо-сертификат','demo certificate')+'</span><h1>'+kind+'</h1>'+
   '<p>'+tr('Команда','Team')+' <b>'+E(p.team)+'</b> ('+p.members+' '+tr('чел.','members')+')<br>'+tr('опубликовала проект','published the project')+' <b>«'+E(p.title)+'»</b><br>'+tr('в кубке','in')+' <b>'+E(c.name)+'</b>, '+E(c.city)+', '+E(CN[c.country])+'</p>'+
   '<div class="row" style="justify-content:center">'+lvlTag(precheck(p).score)+'<span class="tag">'+tr('Итог ','Total ')+total(p)+'</span><span class="tag">'+tr('Финал ','Final ')+fd(c.final)+'</span></div>'+
   (win?'<div class="okmsg" style="text-align:left"><b>'+tr('Путёвка в городской финал.','Ticket to the city final.')+'</b> '+tr('Следующий этап: ','Next stage: ')+E(c.city)+tr(', затем национальный финал: ',', then the national final: ')+E(CN[c.country])+'.</div>':'')+
   '<span class="id">'+tr('Код проверки: ','Verification code: ')+certId(p)+'</span>'+
   '<p class="small muted">'+tr('По этому коду вуз или работодатель проверяет сертификат на странице лиги. Сертификат подтверждает опубликованный проект, а не преимущество при поступлении.','A university or employer checks the certificate with this code on the league page. It confirms a published project, not an admissions advantage.')+'</p></div></section>';
}

function vLeague(){
  var by={}; S.cups.forEach(function(c){var k=c.country; by[k]=by[k]||{cups:0,pr:0,win:0}; by[k].cups++; by[k].pr+=cupProjects(c.code).length; if(c.winner)by[k].win++});
  var schools=S.cups.map(function(c){var l=ranked(c.code);return {c:c,n:l.length,best:l.length?total(l[0]):0}}).sort(function(a,b){return b.n-a.n||b.best-a.best});
  var winners=S.cups.filter(function(c){return c.winner});
  return '<section><h1>'+tr('Лига','League')+'</h1><p class="muted">'+tr('Один бренд, сотни организаторов. Каждый кубок даёт путёвку на уровень выше.','One brand, hundreds of organisers. Every cup gives a ticket one level up.')+'</p>'+pathHtml()+'</section>'+
   '<section><h2>'+tr('Страны','Countries')+'</h2><div class="scroll"><table><thead><tr><th>'+tr('Страна','Country')+'</th><th class="r">'+tr('Кубков','Cups')+'</th><th class="r">'+tr('Проектов','Projects')+'</th><th class="r">'+tr('Путёвок в финал','Final tickets')+'</th></tr></thead><tbody>'+
   Object.keys(by).sort(function(a,b){return by[b].pr-by[a].pr}).map(function(k){return '<tr><td>'+E(CN[k])+'</td><td class="r">'+by[k].cups+'</td><td class="r">'+by[k].pr+'</td><td class="r">'+by[k].win+'</td></tr>'}).join('')+'</tbody></table></div></section>'+
   '<section><h2>'+tr('Рейтинг организаторов','Organiser ranking')+'</h2><p class="small muted">'+tr('Место определяют число опубликованных проектов и лучший итоговый балл. Это мотив для школы провести кубок.','Rank is set by the number of published projects and the best total. This is the school\'s reason to run a cup.')+'</p><div class="scroll"><table><thead><tr><th>#</th><th>'+tr('Организатор','Organiser')+'</th><th>'+tr('Город','City')+'</th><th class="r">'+tr('Проектов','Projects')+'</th><th class="r">'+tr('Лучший балл','Best total')+'</th></tr></thead><tbody>'+
   schools.map(function(s,i){return '<tr><td class="num">'+(i+1)+'</td><td><button class="btn sm" data-go="cup-'+s.c.code+'">'+E(s.c.org)+'</button></td><td>'+E(s.c.city)+', '+E(CN[s.c.country])+'</td><td class="r">'+s.n+'</td><td class="r">'+(s.best||'—')+'</td></tr>'}).join('')+'</tbody></table></div></section>'+
   '<section><h2>'+tr('Путёвки в следующий этап','Tickets to the next stage')+'</h2>'+(winners.length?'<div class="grid">'+winners.map(function(c){var p=proj(c.winner);return '<div class="card"><span class="tag done">'+tr('Победитель','Winner')+'</span><h3>'+E(p.title)+'</h3><p class="small muted">'+E(p.team)+' · '+E(c.name)+'</p><div class="row"><button class="btn sm" data-go="cert-'+p.id+'">'+tr('Сертификат','Certificate')+'</button></div></div>'}).join('')+'</div>':'<div class="empty">'+tr('Путёвок пока нет.','No tickets yet.')+'</div>')+'</section>'+
   '<section style="max-width:560px"><h2>'+tr('Проверка сертификата','Verify a certificate')+'</h2><form id="verify-form"><div class="field"><label for="v-code">'+tr('Код проверки','Verification code')+'</label><input type="text" id="v-code" class="mono" placeholder="FCA-AST4MX-B1" autocomplete="off"></div><div class="row"><button class="btn" type="submit">'+tr('Проверить','Verify')+'</button></div><p class="small" id="v-out" hidden></p></form></section>';
}

var calc={cups:500,ppc:20,team:3,viewers:6,cost:30000};
function calcOut(){
  var pr=calc.cups*calc.ppc, part=pr*calc.team, vw=pr*calc.viewers, users=part+vw, cost=calc.cups*calc.cost, cpp=pr?Math.round(cost/pr):0;
  var bar=function(v,goal){var w=Math.min(100,Math.round(v/goal*100));return '<div class="meter '+(v>=goal?'good':'')+'"><i style="width:'+w+'%"></i></div><span class="small muted num">'+w+'% '+tr('от цели ','of the goal of ')+nf(goal)+'</span>'};
  return '<div class="stat"><div><b>'+nf(pr)+'</b><span>'+tr('опубликованных проектов','published projects')+'</span></div><div><b>'+nf(users)+'</b><span>'+tr('пользователей','users')+'</span></div><div><b>'+nf(cpp)+' ₸</b><span>'+tr('на один проект','per project')+'</span></div></div>'+
   '<div class="plain"><b>'+tr('Проекты','Projects')+'</b>'+bar(pr,10000)+'</div><div class="plain"><b>'+tr('Пользователи','Users')+'</b>'+bar(users,100000)+'<span class="small muted">'+nf(part)+tr(' участников + ',' participants + ')+nf(vw)+tr(' зрителей, вошедших ради голосования',' viewers who signed in to vote')+'</span></div>'+
   '<div class="plain"><b>'+tr('Расходы платформы','Platform costs')+'</b><span class="num">'+nf(cost)+' ₸ '+tr('всего','total')+'</span><span class="small muted">'+tr('Для сравнения: около 16 000 ₸ за проект сейчас. Это оценка команды по допущению (9 млн ₸ на привлечение и 567 проектов), а не данные AI Startify.','For comparison: about 16,000 ₸ per project today. This is the team\'s estimate from an assumption (9M ₸ on acquisition and 567 projects), not AI Startify data.')+'</span></div>';
}
function vImpact(){
  var sl=function(k,label,min,max,step,unit){return '<div class="field"><label for="k-'+k+'">'+label+': <b class="num" id="kv-'+k+'">'+nf(calc[k])+'</b>'+unit+'</label><input type="range" id="k-'+k+'" data-calc="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+calc[k]+'"></div>'};
  return '<section><h1>'+tr('Путь к 10 000 проектов','The path to 10,000 projects')+'</h1><p class="muted">'+tr('Все значения ниже являются допущениями. Реальные средние покажут первые 10 кубков пилота.','Every value below is an assumption. The first 10 pilot cups will show the real averages.')+'</p></section>'+
   '<div class="two"><div class="card"><div class="row"><button class="btn sm" data-act="scen" data-v="10">'+tr('Осторожный: 10 проектов на кубок','Cautious: 10 projects per cup')+'</button><button class="btn sm" data-act="scen" data-v="20">'+tr('Базовый: 20','Base: 20')+'</button><button class="btn sm" data-act="scen" data-v="30">'+tr('Смелый: 30','Bold: 30')+'</button></div>'+
   sl('cups',tr('Кубков за год','Cups per year'),10,1500,10,'')+sl('ppc',tr('Опубликованных проектов на кубок','Published projects per cup'),5,40,1,'')+sl('team',tr('Человек в команде','People per team'),1,5,1,'')+sl('viewers',tr('Зрителей на проект, вошедших для голосования','Viewers per project who sign in to vote'),0,15,1,'')+sl('cost',tr('Расходы платформы на кубок','Platform cost per cup'),0,200000,5000,' ₸')+
   '<p class="small muted">'+tr('В расходах на кубок: поддержка организатора, ИИ-проверка, сертификаты. Организаторам не платят, призы дают спонсоры.','Cost per cup covers organiser support, AI checks and certificates. Organisers are not paid; sponsors provide prizes.')+'</p></div>'+
   '<div class="card" id="calc-out">'+calcOut()+'</div></div>'+
   '<section><h2>'+tr('Сколько кубков нужно для 10 000 проектов','How many cups 10,000 projects take')+'</h2><div class="scroll"><table><thead><tr><th>'+tr('Проектов на кубок','Projects per cup')+'</th><th class="r">'+tr('Кубков','Cups')+'</th><th>'+tr('Что это значит','What it means')+'</th></tr></thead><tbody>'+
   '<tr><td>10</td><td class="r">1 000</td><td>'+tr('Маленькие школьные кубки, один класс','Small school cups, one class')+'</td></tr><tr><td>20</td><td class="r">500</td><td>'+tr('Параллель или два класса','A year group or two classes')+'</td></tr><tr><td>30</td><td class="r">334</td><td>'+tr('Вся школа или городской клуб','A whole school or a city club')+'</td></tr></tbody></table></div></section>';
}
function vNotFound(){return '<section><div class="empty"><b>'+tr('Страница не найдена','Page not found')+'</b><button class="btn" data-go="home">'+tr('На главную','Go to the home page')+'</button></div></section>'}

function render(){
  var r=route, html, nav='home';
  if(r==='home'||!r) html=vHome();
  else if(r==='cups'){html=vCups();nav='cups'}
  else if(r==='create'){html=vCreate();nav='create'}
  else if(r==='join'){html=vJoin();nav='join'}
  else if(r==='league'){html=vLeague();nav='league'}
  else if(r==='impact'){html=vImpact();nav='impact'}
  else if(r.indexOf('cup-')===0){html=vCup(r.slice(4));nav='cups'}
  else if(r.indexOf('submit-')===0){html=vSubmit(r.slice(7));nav='cups'}
  else if(r.indexOf('edit-')===0){html=vSubmit(null,r.slice(5));nav='cups'}
  else if(r.indexOf('project-')===0){html=vProject(r.slice(8));nav='cups'}
  else if(r.indexOf('cert-')===0){html=vCert(r.slice(5));nav='league'; if(!S.tour.cert){S.tour.cert=1;save()}}
  else html=vNotFound();
  document.getElementById('app').innerHTML=html; flash='';
  var items=[['cups',tr('Кубки','Cups')],['create',tr('Запустить','Launch')],['join',tr('Войти по коду','Join')],['league',tr('Лига','League')],['impact',tr('Цели','Goals')]];
  document.getElementById('nav').innerHTML=items.map(function(i){return '<button data-go="'+i[0]+'"'+(nav===i[0]?' aria-current="page"':'')+'>'+i[1]+'</button>'}).join('');
  document.getElementById('lang-ru').setAttribute('aria-pressed',S.lang==='ru'); document.getElementById('lang-en').setAttribute('aria-pressed',S.lang==='en');
  document.getElementById('ribbon').textContent=tr('Прототип команды для хакатона AI Startify Global Growth Challenge. Не официальный продукт AI Startify. Все кубки, команды, проекты и цифры здесь являются демо-данными.','A team prototype for the AI Startify Global Growth Challenge hackathon. Not an official AI Startify product. All cups, teams, projects and numbers here are demo data.');
  document.getElementById('foot').textContent=tr('Founder Cup Anywhere · концепт. Данные хранятся только в этом браузере.','Founder Cup Anywhere · concept. Data is stored only in this browser.');
  document.getElementById('reset-btn').textContent=tr('Сбросить демо','Reset demo');
  document.documentElement.lang=S.lang;
}

/* events */
function newCode(){var a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',c;do{c='';for(var i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)]}while(cup(c));return c}
function saveProject(form,publish){
  var code=form.getAttribute('data-code'), pid=form.getAttribute('data-pid'), v=formProject(), err=document.getElementById('p-err');
  var consent=document.getElementById('p-consent').checked, sc=precheck(v).score, msg='';
  if(!v.title.trim()||!v.team.trim()) msg=tr('Укажите название проекта и команды.','Enter the project and team names.');
  else if(publish&&!consent) msg=tr('Для публикации подтвердите согласие родителей.','To publish, confirm parental consent.');
  else if(publish&&sc<GATE) msg=tr('Для публикации нужно ','To publish you need ')+GATE+tr(' баллов предпроверки. Сейчас ',' pre-check points. You have ')+sc+'.';
  if(msg){err.textContent=msg;err.hidden=false;return}
  var p=pid?proj(pid):null;
  if(!p){p={id:'u'+(S.seq++),cup:code,votes:0,jury:null,mine:true};S.projects.push(p)}
  p.title=v.title.trim();p.team=v.team.trim();p.members=v.members;p.problem=v.problem.trim();p.audience=v.audience.trim();p.solution=v.solution.trim();p.evidence=v.evidence.trim();p.link=v.link.trim();p.consent=consent;
  p.status=publish?'published':'draft';
  if(publish){S.tour.published=1;flash=tr('Проект опубликован. Команда участвует в кубке.','The project is published. The team is in the cup.')}
  save(); if(publish){cupTab='projects';go('project-'+p.id);toast(tr('Проект опубликован','Project published'))} else {go('project-'+p.id);toast(tr('Черновик сохранён','Draft saved'))}
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act],[data-lang]'); if(!t) return;
  if(t.hasAttribute('data-lang')){S.lang=t.getAttribute('data-lang');save();render();return}
  if(t.hasAttribute('data-go')){if(t.hasAttribute('data-tab'))cupTab=t.getAttribute('data-tab'); else if(t.getAttribute('data-go').indexOf('cup-')===0&&route.indexOf('cup-')!==0)cupTab='projects'; go(t.getAttribute('data-go'));return}
  var a=t.getAttribute('data-act'), p;
  if(a==='tab'){cupTab=t.getAttribute('data-tab');render()}
  else if(a==='filter'){cupFilter=t.getAttribute('data-k');render()}
  else if(a==='vote'){p=proj(t.getAttribute('data-id'));if(p&&!S.voted[p.id]){p.votes++;S.voted[p.id]=1;S.tour.voted=1;save();render();toast(tr('Голос учтён','Vote counted'))}}
  else if(a==='copy'){copy(document.getElementById(t.getAttribute('data-src')).textContent)}
  else if(a==='draft'){saveProject(document.getElementById('project-form'),false)}
  else if(a==='jury-save'){p=proj(t.getAttribute('data-id'));p.jury=[0,1,2].map(function(i){return parseInt(document.getElementById('j-'+p.id+'-'+i).value,10)});save();render();toast(tr('Оценка сохранена','Score saved'))}
  else if(a==='announce'){var c=cup(t.getAttribute('data-code')),l=ranked(c.code).filter(function(x){return x.jury});if(l.length){c.winner=l[0].id;S.tour.judged=1;save();render();toast(tr('Победитель объявлен','Winner announced'))}}
  else if(a==='scen'){calc.ppc=parseInt(t.getAttribute('data-v'),10);calc.cups=Math.ceil(10000/calc.ppc/10)*10;render()}
  else if(a==='reset'){try{localStorage.removeItem(LS)}catch(x){} S=seed();cupTab='projects';go('home');toast(tr('Демо сброшено','Demo reset'))}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.closest('#project-form')){var cp=document.getElementById('check-panel');if(cp)cp.innerHTML=checkPanel(formProject());var pe=document.getElementById('p-err');if(pe)pe.hidden=true}
  else if(t.hasAttribute('data-calc')){var k=t.getAttribute('data-calc');calc[k]=parseFloat(t.value);document.getElementById('kv-'+k).textContent=nf(calc[k]);document.getElementById('calc-out').innerHTML=calcOut()}
  else if(t.hasAttribute('data-jv')){document.getElementById(t.getAttribute('data-jv')).textContent=t.value}
});
document.addEventListener('submit',function(e){
  var f=e.target; e.preventDefault();
  if(f.id==='join-form'){var code=document.getElementById('join-code').value.trim().toUpperCase(),c=cup(code),er=document.getElementById('join-err');
    if(c){cupTab='projects';go('cup-'+code)}else{er.textContent=tr('Кубок с таким кодом не найден. Проверьте код у организатора.','No cup with this code. Check the code with your organiser.');er.hidden=false}}
  else if(f.id==='create-form'){var g=function(id){return document.getElementById(id).value.trim()};
    var nc={code:newCode(),name:g('c-name'),org:g('c-org'),type:g('c-type'),city:g('c-city'),country:g('c-country'),deadline:g('c-deadline'),final:g('c-final'),ages:g('c-ages')||'14–17',prize:g('c-prize'),winner:null,mine:true};
    if(nc.final<nc.deadline)nc.final=nc.deadline;
    S.cups.unshift(nc);S.tour.created=1;save();cupTab='org';flash=tr('Кубок создан. Код для команд: ','The cup is created. Code for teams: ')+'<b class="mono">'+nc.code+'</b>. '+tr('Ниже приглашение и план на 4 недели.','The invitation and the 4-week plan are below.');go('cup-'+nc.code)}
  else if(f.id==='project-form'){saveProject(f,true)}
  else if(f.id==='verify-form'){var q=document.getElementById('v-code').value.trim().toUpperCase(),out=document.getElementById('v-out'),hit=S.projects.filter(function(p){return p.status==='published'&&certId(p)===q})[0];
    out.hidden=false; if(hit){out.style.color='var(--good)';out.innerHTML=tr('Сертификат действителен: ','Certificate is valid: ')+'<b>'+E(hit.title)+'</b>, '+E(hit.team)+', '+E(cup(hit.cup).name)+'. <button class="btn sm" type="button" data-go="cert-'+hit.id+'">'+tr('Открыть','Open')+'</button>'}else{out.style.color='var(--warn)';out.textContent=tr('Сертификат с таким кодом не найден.','No certificate with this code.')}}
});

var h0=''; try{h0=location.hash.slice(1)}catch(e){}
route=h0||'home'; render();
})();
</script>
